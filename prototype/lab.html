<!doctype html><html lang="en"><meta charset="utf-8"><title>NH Motif Geometry Lab</title><style>body{font:16px system-ui;margin:32px;max-width:1100px}input{padding:8px}section{display:flex;gap:20px}section>div{width:48%}img,svg{width:100%;max-height:600px}pre{white-space:pre-wrap}</style><h1>NH Motif Geometry Lab — Experimental</h1><p>Palette-guided geometry, not manual reconstruction. Runs on your local Python server. Inspect holes, tiny details, circles and color joins before production.</p><p><input id="file" type="file" accept="image/png,image/jpeg"></p><p><label>Exact colors (hex, comma separated) <input id="palette" size="55" value="#ffffff,#183728,#c65d63,#e9b84c"></label></p><p><label>Curve tolerance, px <input id="tol" type="number" value="1" min="0.25" max="3" step="0.25"></label> <button id="convert">Reconstruct</button> <button id="download" disabled>Download SVG</button></p><pre id="status"></pre><section><div><h2>Original</h2><img id="original" alt="Original motif"></div><div><h2>Geometry</h2><div id="result"></div></div></section><script>
let svg='';const el=id=>document.getElementById(id);el('convert').onclick=async()=>{try{let f=el('file').files[0];if(!f)throw Error('Choose an image');if(f.size>10000000)throw Error('Limit: 10MB');el('status').textContent='Reconstructing…';el('convert').disabled=true;el('download').disabled=true;const data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});el('original').src=data;const response=await fetch('/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data.split(',')[1],palette:el('palette').value,tolerance:el('tol').value})});const x=await response.json();if(x.error)throw Error(x.error);svg=x.svg;el('result').innerHTML=svg;el('status').textContent=JSON.stringify(x.stats,null,2);el('download').disabled=false}catch(e){el('status').textContent=e.message}finally{el('convert').disabled=false}};el('download').onclick=()=>{const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));let a=document.createElement('a');a.href=u;a.download='motif-geometry.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
