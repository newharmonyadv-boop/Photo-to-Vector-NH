<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo to Vector</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
    }

    h1{
      text-align:center;
      font-size:42px;
    }

    p{
      text-align:center;
      color:#94a3b8;
    }

    .upload-box{
      margin-top:30px;
      border:2px dashed #64748b;
      border-radius:20px;
      padding:40px;
      text-align:center;
      background:#111827;
    }

    input{
      margin-top:15px;
    }

    button{
      padding:12px 20px;
      margin:10px 5px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

    #convertBtn{
      background:#6366f1;
      color:white;
    }

    #downloadBtn{
      background:#16a34a;
      color:white;
    }

    .preview{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:30px;
    }

    .box{
      background:#111827;
      padding:20px;
      border-radius:20px;
    }

    .preview-area{
      background:white;
      min-height:300px;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      border-radius:10px;
    }

    img, svg{
      max-width:100%;
      max-height:400px;
    }

    @media(max-width:700px){
      .preview{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Photo → Vector</h1>

  <p>Upload JPG / PNG and convert to SVG Vector</p>

  <div class="upload-box">

    <input
      type="file"
      id="fileInput"
      accept="image/png,image/jpeg,image/webp"
    >

    <br>

    <button id="convertBtn">
      Convert to SVG
    </button>

    <button id="downloadBtn" disabled>
      Download SVG
    </button>

  </div>

  <div class="preview">

    <div class="box">
      <h3>Original Photo</h3>

      <div class="preview-area">
        <img id="originalImage">
      </div>
    </div>

    <div class="box">
      <h3>Vector Result</h3>

      <div
        class="preview-area"
        id="vectorPreview">
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

<script>

let imageData = "";
let svgData = "";

const fileInput =
document.getElementById("fileInput");

const originalImage =
document.getElementById("originalImage");

const vectorPreview =
document.getElementById("vectorPreview");

const convertBtn =
document.getElementById("convertBtn");

const downloadBtn =
document.getElementById("downloadBtn");


fileInput.addEventListener(
"change",
function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload =
  function(event){

    imageData =
    event.target.result;

    originalImage.src =
    imageData;

  };

  reader.readAsDataURL(file);

});


convertBtn.addEventListener(
"click",
function(){

  if(!imageData){

    alert("Please choose a photo first.");

    return;
  }

  ImageTracer.imageToSVG(

    imageData,

    function(svg){

      svgData = svg;

      vectorPreview.innerHTML =
      svg;

      downloadBtn.disabled =
      false;

    },

    "posterized2"

  );

});


downloadBtn.addEventListener(
"click",
function(){

  if(!svgData) return;

  const blob =
  new Blob(
    [svgData],
    {
      type:"image/svg+xml"
    }
  );

  const url =
  URL.createObjectURL(blob);

  const a =
  document.createElement("a");

  a.href = url;

  a.download =
  "vector-image.svg";

  a.click();

  URL.revokeObjectURL(url);

});

</script>

</body>
</html>
